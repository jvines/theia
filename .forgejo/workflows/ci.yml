name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build -v

      - name: Generate sample FITS fixture
        run: swift scripts/make_sample_fits.swift > sample.fits

      - name: Check shared Swift API boundaries
        run: scripts/check_shared_api.sh

      - name: Test
        run: swift test --parallel

  neutral-linux:
    name: Swift + GTK4 (AlmaLinux 8, x86_64)
    runs-on: checo
    steps:
      - name: Checkout with host Git
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build Swift 6.3.3 AlmaLinux 8 image
        run: docker build --platform linux/amd64 --label cl.jvines.owner=theia-ci -t theia-ci-almalinux8-swift63:latest -f ci/Dockerfile.almalinux8-swift63 ci

      - name: Build pinned GTK4 stack
        run: docker build --platform linux/amd64 --label cl.jvines.owner=theia-ci --iidfile ci-image-id -f ci/Dockerfile.almalinux8-gtk4 ci

      - name: Build and test Linux app and shared targets
        run: |
          docker run --rm --platform linux/amd64 --label cl.jvines.owner=theia-ci \
            --mount type=bind,source="$PWD",target=/src,readonly \
            --workdir /tmp "$(cat ci-image-id)" sh -ec '
              mkdir -p /tmp/theia
              test "$(uname -m)" = x86_64
              tar -C /src --exclude=.git --exclude=.build --exclude=sample.fits -cf - . | tar -C /tmp/theia -xf -
              cd /tmp/theia
              swift scripts/make_sample_fits.swift > sample.fits
              scripts/check_shared_api.sh
              swift build -j 2
              xvfb-run -a swift test -j 2
              xvfb-run -a ci/smoke-gtk.sh "$(swift build --show-bin-path)/theia-gtk" Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
              scripts/test_xpa_local_security.sh "$(swift build --show-bin-path)"
            '

  smoke:
    name: app smoke test (launch + scripting API)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build app
        run: swift build

      # Launches the real app (exercises Metal init + window/document path that
      # `swift test` never touches) and drives it through the localhost HTTP
      # scripting API. Catches crash-on-launch and broken open/render paths.
      - name: Smoke test
        run: scripts/smoke_test.sh
