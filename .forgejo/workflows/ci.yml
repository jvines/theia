name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build -v

      - name: Generate sample FITS fixture
        run: swift scripts/make_sample_fits.swift > sample.fits

      - name: Check shared Swift API boundaries
        run: scripts/check_shared_api.sh

      - name: Test
        run: swift test --parallel

  neutral-linux:
    name: Swift + GTK4 (AlmaLinux 8, x86_64)
    runs-on: checo
    steps:
      - name: Checkout with host Git
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build Swift 6.3.3 AlmaLinux 8 image
        run: docker build --platform linux/amd64 --label cl.jvines.owner=theia-ci -t theia-ci-almalinux8-swift63:latest -f ci/Dockerfile.almalinux8-swift63 ci

      - name: Build pinned GTK4 stack
        run: docker build --platform linux/amd64 --label cl.jvines.owner=theia-ci --iidfile ci-image-id -f ci/Dockerfile.almalinux8-gtk4 ci

      - name: Build, test and package Linux app
        run: |
          release_dir=$(mktemp -d /tmp/theia-linux-ci.XXXXXX)
          trap 'rm -rf "$release_dir"' EXIT
          docker run --rm --platform linux/amd64 --label cl.jvines.owner=theia-ci \
            -e THEIA_SOURCE_REVISION="$GITHUB_SHA" \
            --mount type=bind,source="$PWD",target=/src,readonly \
            --mount type=bind,source="$release_dir",target=/out \
            --workdir /tmp "$(cat ci-image-id)" sh -ec '
              release_owner=$(stat -c %u:%g /out)
              trap "chown -R $release_owner /out" EXIT
              mkdir -p /tmp/theia
              test "$(uname -m)" = x86_64
              tar -C /src --exclude=.git --exclude=.build --exclude=sample.fits -cf - . | tar -C /tmp/theia -xf -
              cd /tmp/theia
              swift scripts/make_sample_fits.swift > sample.fits
              scripts/check_shared_api.sh
              swift build -j 2
              xvfb-run -a ci/test-gtk.sh
              DIST_DIR=/out CONFIG=release THEIA_SWIFT_JOBS=2 scripts/package_linux.sh
              for candidate in /out/Theia-*-linux-x86_64; do
                if [ -d "$candidate" ]; then stage=$candidate; break; fi
              done
              test -n "${stage:-}"
              for sample in nicmos_mosaic.fits wfpc2_cube.fits fos_bintable.fits feros_tau_ceti_20240730.fits; do
                test -s "$stage/share/theia/samples/$sample"
              done
              # Only executables Theia runs or offers to the user ship in bin/.
              test "$(ls "$stage/bin" | tr "\n" " ")" = "ffmpeg theia theia-gtk theia-remote-helper theiactl xpaget xpans xpaset "
              ci/check-package-fonts.sh "$stage"
              scripts/package_appimage.sh "$stage" "$stage.AppImage"
            '

          docker build --platform linux/amd64 --label cl.jvines.owner=theia-ci \
            -t theia-runtime-smoke:ci -f ci/Dockerfile.almalinux8-runtime ci
          docker build --platform linux/amd64 --label cl.jvines.owner=theia-ci \
            -t theia-rocky-runtime-smoke:ci -f ci/Dockerfile.rockylinux8-runtime ci
          for candidate in "$release_dir"/Theia-*-linux-x86_64; do
            if [ -d "$candidate" ]; then stage=$candidate; break; fi
          done
          test -n "${stage:-}"
          for runtime_image in theia-runtime-smoke:ci theia-rocky-runtime-smoke:ci; do
            docker run --rm --platform linux/amd64 --user 1000:1000 \
              --mount type=bind,source="$PWD",target=/src,readonly \
              --mount type=bind,source="$stage",target=/opt/theia,readonly \
              --workdir /src "$runtime_image" sh -ec '
                xvfb-run -a ci/smoke-gtk.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
                xvfb-run -a ci/smoke-gtk-http.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
                xvfb-run -a ci/smoke-gtk-multi-instance.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
                mkdir -p /tmp/links
                ln -s /opt/theia/bin/theia /tmp/links/theia-fits
                xvfb-run -a ci/smoke-gtk.sh /tmp/links/theia-fits Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
              '
          done
          docker run --rm --platform linux/amd64 \
            --mount type=bind,source="$PWD",target=/src,readonly \
            --mount type=bind,source="$stage",target=/opt/theia,readonly \
            --workdir /src theia-runtime-smoke:ci sh -ec '
              xvfb-run -a ci/smoke-gtk-xpa.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
              xvfb-run -a ci/smoke-gtk-xpa-unix.sh /opt/theia/bin/theia
              xvfb-run -a ci/smoke-gtk-theiactl.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
            '
          for runtime_image in theia-runtime-smoke:ci theia-rocky-runtime-smoke:ci; do
            docker run --rm --platform linux/amd64 \
              --mount type=bind,source="$PWD",target=/src,readonly \
              --mount type=bind,source="$stage",target=/opt/theia,readonly \
              --workdir /src "$runtime_image" sh -ec '
                bash ci/smoke-gtk-ssh-x.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
              '
          done
          for runtime_image in theia-runtime-smoke:ci theia-rocky-runtime-smoke:ci; do
            docker run --rm --platform linux/amd64 \
              --mount type=bind,source="$PWD",target=/src,readonly \
              --mount type=bind,source="$stage",target=/opt/theia,readonly \
              --workdir /src "$runtime_image" sh -ec '
                xvfb-run -a ci/smoke-gtk-native-remote.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
              '
          done
          docker build --platform linux/amd64 --label cl.jvines.owner=theia-ci \
            -t theia-wayland-smoke:ci -f ci/Dockerfile.wayland-smoke ci
          docker run --rm --platform linux/amd64 --label cl.jvines.owner=theia-ci \
            --mount type=bind,source="$PWD",target=/src,readonly \
            --mount type=bind,source="$stage",target=/opt/theia,readonly \
            --workdir /src theia-wayland-smoke:ci \
            bash ci/smoke-gtk-waypipe.sh /opt/theia/bin/theia Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
          for runtime_image in theia-runtime-smoke:ci theia-rocky-runtime-smoke:ci; do
            docker run --rm --platform linux/amd64 --user 1000:1000 \
              --mount type=bind,source="$PWD",target=/src,readonly \
              --mount type=bind,source="$stage.AppImage",target=/opt/theia.AppImage,readonly \
              --workdir /src -e APPIMAGE_EXTRACT_AND_RUN=1 \
              "$runtime_image" sh -ec '
                xvfb-run -a ci/smoke-gtk.sh /opt/theia.AppImage Tests/TheiaGTKTests/Fixtures/uint8_simple.fits
              '
          done

  smoke:
    name: app smoke test (launch + scripting API)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build app
        run: swift build

      # Launches the real app (exercises Metal init + window/document path that
      # `swift test` never touches) and drives it through the localhost HTTP
      # scripting API. Catches crash-on-launch and broken open/render paths.
      - name: Smoke test
        run: scripts/smoke_test.sh
